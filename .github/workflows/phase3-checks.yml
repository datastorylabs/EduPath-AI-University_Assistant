name: EduPath final integration checks

on:
  push:
    branches:
      - "rebuild/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  admissions-and-advisor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install lightweight backend and test dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Validate admissions JSON data
        run: |
          python -c "import json; json.load(open('backend/app/data/admissions_sources.json', encoding='utf-8')); json.load(open('backend/app/data/admissions_rules.json', encoding='utf-8'))"
      - name: Verify clean SQLite migrations and ORM schema
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:///./edupath-ci.db
        run: |
          rm -f edupath-ci.db
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini current
          alembic -c backend/alembic.ini check
      - name: Install original Streamlit UI and document-processing runtime
        run: python -m pip install "streamlit>=1.38,<2" "pymupdf>=1.24,<2" "pillow>=10.2,<13" "pytesseract>=0.3.10,<1" "pytest>=8,<9"
      - name: Run API, persistence, private storage, OCR, pipeline, and advisor tests
        run: python -m pytest -q tests/api tests/test_legacy_storage.py tests/test_private_documents.py tests/test_ocr.py tests/test_pipeline.py tests/test_conversational_advisor.py

