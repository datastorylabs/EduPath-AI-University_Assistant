name: Phase 3 admissions checks

on:
  push:
    branches:
      - "rebuild/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  admissions-and-advisor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install lightweight backend and test dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Validate admissions JSON data
        run: |
          python -c "import json; json.load(open('backend/app/data/admissions_sources.json', encoding='utf-8')); json.load(open('backend/app/data/admissions_rules.json', encoding='utf-8'))"
      - name: Verify clean SQLite migrations and ORM schema
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:///./edupath-ci.db
        run: |
          rm -f edupath-ci.db
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini current
          alembic -c backend/alembic.ini check
      - name: Run API, source registry, deterministic rules, and conversational advisor tests
        run: python -m pytest -q tests/api tests/test_conversational_advisor.py

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install pinned frontend dependencies without lifecycle scripts
        working-directory: frontend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  legacy-streamlit-security-and-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted Streamlit, OCR and storage dependencies
        run: |
          python -m pip install -r requirements-api.txt
          python -m pip install "streamlit>=1.38.0" "pandas>=2.0.0" "python-dateutil>=2.8.2" "pymupdf>=1.24.0" "pillow>=10.2.0" "pytesseract>=0.3.10"
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Verify fresh migrations and targeted legacy OCR/state tests
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:///./edupath-ci.db
          SECRET_KEY: ci-only-secret-for-tests-not-for-deployment-000000000000
        run: |
          rm -f edupath-ci.db
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check
          python -m pytest -q tests/test_ocr.py tests/test_pdf_extraction.py tests/test_document_labels.py tests/test_document_status.py tests/test_legacy_storage.py tests/test_ocr_hardening.py
