[theme]
primaryColor = "#4F46E5"
backgroundColor = "#F7F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E1B34"
font = "sans serif"

[client]
showSidebarNavigation = true

[server]
# Enforce the document pipeline's 10 MB per-file limit before files reach Python.
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true
